<div>
  <label class="block font-medium mb-2">{{ label }}</label>
  <p-autoComplete
    [(ngModel)]="usuarioSeleccionado"
    [suggestions]="sugerencias()"
    (completeMethod)="buscar($event)"
    (onSelect)="onSeleccionar($event.value)"
    (onClear)="onLimpiar()"
    optionLabel="email"
    [placeholder]="placeholder"
    appendTo="body"
    [dropdown]="true"
    [forceSelection]="true"
    styleClass="w-full"
    [inputStyle]="{ width: '100%' }"
  >
    <ng-template let-usuario pTemplate="item">
      <div class="flex flex-col">
        <span class="font-medium">{{ usuario.nombre }} {{ usuario.apellido }}</span>
        <span class="text-sm text-muted-color">{{ usuario.email }}</span>
      </div>
    </ng-template>
  </p-autoComplete>
</div>
