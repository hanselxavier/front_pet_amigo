<div>
  <label class="block font-medium mb-2">{{ label }}</label>
  <p-autoComplete
    [(ngModel)]="mascotaSeleccionada"
    [suggestions]="sugerencias()"
    (completeMethod)="buscar($event)"
    (onSelect)="onSeleccionar($event.value)"
    (onClear)="onLimpiar()"
    optionLabel="nombre"
    [placeholder]="usuarioId ? placeholder : 'Selecciona primero un usuario'"
    [disabled]="!usuarioId"
    [dropdown]="true"
    [forceSelection]="true"
    appendTo="body"
    scrollHeight="200px"
    styleClass="w-full"
    [inputStyle]="{ width: '100%' }"
  >
    <ng-template let-mascota pTemplate="item">
      <div class="flex flex-col">
        <span class="font-medium">{{ mascota.nombre }}</span>
        <span class="text-sm text-muted-color capitalize">{{ mascota.especie }}</span>
      </div>
    </ng-template>
  </p-autoComplete>
  @if (!usuarioId) {
    <small class="text-muted-color">Elige un usuario para ver sus mascotas.</small>
  }
</div>
