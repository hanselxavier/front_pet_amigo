<p-dialog
  [visible]="visible"
  (visibleChange)="cerrar()"
  [modal]="true"
  [style]="{ width: '26rem' }"
  [header]="'Solicitar placa para ' + (mascota?.nombre ?? '')"
>
  <div class="flex flex-col gap-4" style="min-height: 6rem">
    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }

    <p class="text-sm text-muted-color">
      Un administrador revisará tu solicitud y se pondrá en contacto contigo para coordinar el pago y la entrega del collar.
    </p>

    <div>
      <label class="block font-medium mb-2">Plan deseado</label>
      <p-select
        [options]="opcionesPlan"
        [(ngModel)]="planElegido"
        optionLabel="label"
        optionValue="value"
        class="w-full"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="cerrar()" />
    <p-button label="Enviar solicitud" [loading]="guardando()" (onClick)="solicitar()" />
  </ng-template>
</p-dialog>
