<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [header]="mascota ? 'Editar mascota' : 'Nueva mascota'"
  (onHide)="cerrar()"
>
  <div class="flex flex-col gap-4">
    @if (esAdmin && !mascota) {
      <app-usuario-autocomplete
        label="Dueño de la mascota"
        [usuarioSeleccionado]="usuarioSeleccionado"
        (usuarioSeleccionadoChange)="alSeleccionarUsuario($event)"
      />
    }

    <div>
      <label class="block font-medium mb-2">Nombre</label>
      <input pInputText [(ngModel)]="form.nombre" class="w-full" />
    </div>

    <div class="flex gap-4">
      <div class="flex-1">
        <label class="block font-medium mb-2">Especie</label>
        <p-select
          [options]="opcionesEspecie"
          [(ngModel)]="form.especie"
          optionLabel="label"
          optionValue="value"
          class="w-full"
        />
      </div>
      <div class="flex-1">
        <label class="block font-medium mb-2">Sexo</label>
        <p-select
          [options]="opcionesSexo"
          [(ngModel)]="form.sexo"
          optionLabel="label"
          optionValue="value"
          class="w-full"
        />
      </div>
    </div>

    <div class="flex gap-4">
      <div class="flex-1">
        <label class="block font-medium mb-2">Raza</label>
        <input pInputText [(ngModel)]="form.raza" class="w-full" />
      </div>
      <div class="flex-1">
        <label class="block font-medium mb-2">Color</label>
        <input pInputText [(ngModel)]="form.color" class="w-full" />
      </div>
    </div>

    <div>
      <label class="block font-medium mb-2">Señas particulares</label>
      <textarea pTextarea [(ngModel)]="form.senasParticulares" rows="3" class="w-full"></textarea>
    </div>

    @if (mascota) {
      <app-mascota-fotos [mascotaId]="mascota.id" />
      


    } @else {
      <small class="text-muted-color">
        Guarda la mascota primero; podrás agregar fotos al editarla.
      </small>
    }

   
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="cerrar()" />
    <p-button label="Guardar" [loading]="guardando()" (onClick)="guardar()" />
  </ng-template>
</p-dialog>
