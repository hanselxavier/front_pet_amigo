<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '28rem' }" header="Registrar pago" (onHide)="cerrar()">
  <div class="flex flex-col gap-4" style="min-height: 8rem">
    @if (error()) {
      <p-message severity="error" [text]="error()!" />
    }

    <app-usuario-autocomplete
      label="Usuario"
      [usuarioSeleccionado]="usuarioSeleccionado"
      (usuarioSeleccionadoChange)="alSeleccionarUsuario($event)"
    />

    <div>
      <label class="block font-medium mb-2">Concepto</label>
      <input pInputText [(ngModel)]="form.concepto" class="w-full" placeholder="Ej. Compra placa plan básico" />
    </div>

    <div class="flex gap-4">
      <div class="flex-1">
        <label class="block font-medium mb-2">Monto (Q)</label>
        <p-inputNumber [(ngModel)]="form.monto" mode="currency" currency="GTQ" locale="es-GT" class="w-full" />
      </div>
      <div class="flex-1">
        <label class="block font-medium mb-2">Método</label>
        <p-select [options]="opcionesMetodo" [(ngModel)]="form.metodoPago" optionLabel="label" optionValue="value" class="w-full" />
      </div>
    </div>

    <div>
      <label class="block font-medium mb-2">Notas (opcional)</label>
      <textarea pTextarea [(ngModel)]="form.notas" rows="2" class="w-full"></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="cerrar()" />
    <p-button label="Registrar" [loading]="guardando()" (onClick)="guardar()" />
  </ng-template>
</p-dialog>
